<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dört Bağla</title>
<meta name="theme-color" content="#25307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dört Bağla">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
/* Düzen: tek sütun. Önce giriş ekranı (fotoğraf, oda), sonra oyun ekranı (oyuncular, tahta, eylemler). */
:root {
  --bg: #F1EEF6;
  --surface: #FFFFFF;
  --fg: #1B1830;
  --muted: #655F82;
  --line: #D9D4E6;
  --board: #25307A;
  --hole: #D3CEE6;
  --p1: #E2503B;
  --p2: #F0B429;
  --ok: #1E8E5A;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13111D; --surface: #1D1A2C; --fg: #ECE9F7; --muted: #A19BBF; --line: #342F4B;
    --board: #2E3A9E; --hole: #0B0A13; --p1: #F0644F; --p2: #F5C04A; --ok: #43C48A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 34rem; margin-inline: auto; display: grid; gap: 18px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800;
  font-size: clamp(2rem, 7vw, 2.7rem); letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance;
}
.lead { margin: 6px 0 0; color: var(--muted); max-width: 40ch; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  padding: .75em 1.2em; border-radius: 12px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
}
.btn.primary { background: var(--board); border-color: var(--board); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .link:focus-visible, .field:focus-visible, .photoBtn:focus-visible {
  outline: 3px solid var(--p2); outline-offset: 2px;
}
.link {
  font: inherit; cursor: pointer; background: none; border: 0; padding: 0;
  color: var(--fg); text-decoration: underline; text-underline-offset: 3px;
}
.note { margin: 0; color: var(--muted); font-size: .92rem; min-height: 1.3em; }

/* Giriş ekranı */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
.me { display: flex; align-items: center; gap: 14px; }
.photoBtn {
  all: unset; box-sizing: border-box; cursor: pointer; flex: none;
  width: 84px; height: 84px; border-radius: 50%; overflow: hidden;
  border: 3px dashed var(--line); background: var(--hole);
  display: grid; place-items: center; text-align: center;
  font-size: .78rem; font-weight: 600; color: var(--muted); line-height: 1.2;
}
.photoBtn[data-has="1"] { border-style: solid; border-color: var(--board); }
.photoBtn:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }
.photoBtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fields { min-width: 0; flex: 1; display: grid; gap: 6px; }
.lab { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field {
  font: inherit; width: 100%; min-width: 0; padding: .65em .8em; border-radius: 10px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line);
}
.code { font-family: var(--font-display); font-weight: 800; letter-spacing: .24em; text-transform: uppercase; font-size: 1.2rem; text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .field { flex: 1 1 8rem; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .9rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.invite { padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.invite b { font-family: var(--font-display); letter-spacing: .18em; }

/* Oyun ekranı */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.roomTag { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
.roomTag b { font-family: var(--font-display); letter-spacing: .18em; color: var(--fg); font-size: 1.05rem; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: .88rem; font-weight: 600; padding: .3em .75em; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pill[data-ok="1"] i { background: var(--ok); }

.players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip {
  min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  transition: border-color .2s, transform .2s;
}
.chip[data-n="1"] { --pc: var(--p1); }
.chip[data-n="2"] { --pc: var(--p2); }
.chip[data-active="1"], .chip[data-won="1"] { border-color: var(--pc); }
.chip[data-won="1"] { transform: translateY(-2px); }
.who { min-width: 0; display: flex; align-items: center; gap: 8px; }
.dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 3px solid var(--pc); background: var(--hole); }
.nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sc { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }

.status { min-height: 1.6em; font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.status .tick { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
.status[data-turn="1"] .tick { background: var(--p1); }
.status[data-turn="2"] .tick { background: var(--p2); }

.board { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--board); border-radius: 18px; padding: 8px 8px 12px; }
.col { all: unset; box-sizing: border-box; display: flex; flex-direction: column; cursor: pointer; min-width: 0; border-radius: 10px; }
.col:focus-visible { outline: 3px solid var(--p2); outline-offset: 1px; }
.ghost { aspect-ratio: 1; position: relative; }
.cell { aspect-ratio: 1; position: relative; background: var(--hole); }
.cell::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(circle closest-side, transparent 0 80%, var(--board) 81%);
}
.disc { position: absolute; inset: 7%; border-radius: 50%; z-index: 1; display: block; }
.disc[data-p="1"] {
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.26), transparent 46%),
    radial-gradient(circle closest-side, transparent 0 84%, var(--p1) 86%),
    var(--img1, none) center / cover no-repeat, var(--p1);
}
.disc[data-p="2"] {
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.3), transparent 46%),
    radial-gradient(circle closest-side, transparent 0 84%, var(--p2) 86%),
    var(--img2, none) center / cover no-repeat, var(--p2);
}
.ghost .disc { opacity: 0; transition: opacity .12s; }
.board.mine .col:hover .ghost .disc, .board.mine .col:focus-visible .ghost .disc { opacity: .6; }
.disc.drop { animation: drop .5s cubic-bezier(.45,0,.7,1) both; }
@keyframes drop {
  0% { transform: translateY(calc((var(--r) + 1.2) * -118%)); }
  72% { transform: none; }
  86% { transform: translateY(-7%); }
  100% { transform: none; }
}
.disc.win::after { content: ""; position: absolute; inset: 33%; border-radius: 50%; background: #fff; opacity: .92; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(.8); } 50% { transform: scale(1.1); } }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.foot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .disc.drop, .disc.win::after { animation: none; } .chip, .ghost .disc { transition: none; } }
</style>
</head>
<body>
<noscript>Bu oyun için JavaScript açık olmalı.</noscript>

<main class="app">
  <header>
    <h1>Dört Bağla</h1>
    <p class="lead" id="lead">İkiniz için özel oda. Hesap gerekmez, bir kod yeter.</p>
  </header>

  <!-- Giriş ekranı -->
  <section id="lobby" class="app" style="gap:16px">
    <div class="card">
      <div class="me">
        <button type="button" class="photoBtn" id="photoBtn" aria-label="Fotoğraf seç"><span id="photoHint">Fotoğraf<br>seç</span></button>
        <div class="fields">
          <label class="lab" for="nameIn">Adın</label>
          <input class="field" id="nameIn" type="text" maxlength="24" autocomplete="off" placeholder="İsteğe bağlı">
        </div>
      </div>
      <input type="file" id="fileIn" accept="image/*" hidden>
    </div>

    <div class="invite" id="invite" hidden>Davet geldi. Oda kodu: <b id="inviteCode"></b></div>
    <div class="actions">
      <button type="button" class="btn primary" id="newBtn">Yeni oda aç</button>
      <button type="button" class="btn primary" id="enterBtn" hidden>Odaya gir</button>
      <button type="button" class="btn" id="lastBtn" hidden></button>
    </div>
    <div class="or" id="orRow">ya da kodla katıl</div>
    <div class="row" id="joinRow">
      <input class="field code" id="codeIn" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KOD" aria-label="Oda kodu">
      <button type="button" class="btn" id="joinBtn">Katıl</button>
    </div>
    <p class="note" id="lobbyNote"></p>
  </section>

  <!-- Oyun ekranı -->
  <section id="game" class="app" hidden>
    <div class="top">
      <div class="roomTag">Oda <b id="roomCode"></b></div>
      <span class="pill" id="net" data-ok="0"><i></i><span id="netText">Bağlanıyor…</span></span>
    </div>
    <div class="players" id="players" aria-label="Oyuncular"></div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="tick"></span><span id="statusText"></span></div>
    <div class="board" id="board" aria-label="Oyun tahtası"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="shareBtn">Davet bağlantısını gönder</button>
      <button type="button" class="btn" id="roundBtn">Yeni tur</button>
    </div>
    <p class="note" id="gameNote"></p>
    <div class="foot">
      <button type="button" class="link" id="leaveBtn">Odadan çık</button>
      <span>Klavyede 1-7 tuşları da çalışır.</span>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Oyun kuralları ve iki cihaz arasındaki eşleşme mantığı. Tarayıcıdan bağımsızdır, node ile test edilebilir. */
(function (root) {
  var ROWS = 6, COLS = 7, N = 42, EMPTY = new Array(N + 1).join("0");

  function fresh() {
    return { ver: 0, board: EMPTY, turn: 1, winner: 0, line: [], last: -1, s1: 0, s2: 0, starter: 1 };
  }

  function dropRow(b, c) {
    for (var r = ROWS - 1; r >= 0; r--) if (b.charAt(r * COLS + c) === "0") return r;
    return -1;
  }

  function winLine(b, idx, p) {
    var r = Math.floor(idx / COLS), c = idx % COLS, ch = String(p);
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < dirs.length; d++) {
      var line = [idx];
      for (var k = 0; k < 2; k++) {
        var sg = k === 0 ? 1 : -1;
        var rr = r + dirs[d][0] * sg, cc = c + dirs[d][1] * sg;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b.charAt(rr * COLS + cc) === ch) {
          line.push(rr * COLS + cc);
          rr += dirs[d][0] * sg; cc += dirs[d][1] * sg;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  /* seat sırası geldiyse taşı col sütununa bırakır, yeni durumu döndürür. Geçersizse null. */
  function move(st, seat, col) {
    if (st.winner || st.turn !== seat || col < 0 || col >= COLS) return null;
    var r = dropRow(st.board, col);
    if (r < 0) return null;
    var idx = r * COLS + col;
    var b = st.board.slice(0, idx) + seat + st.board.slice(idx + 1);
    var winner = 0, line = [], w = winLine(b, idx, seat);
    if (w) { winner = seat; line = w; }
    else if (b.indexOf("0") === -1) winner = 3;
    return {
      ver: st.ver + 1, board: b, turn: seat === 1 ? 2 : 1, winner: winner, line: line, last: idx,
      s1: st.s1 + (winner === 1 ? 1 : 0), s2: st.s2 + (winner === 2 ? 1 : 0), starter: st.starter
    };
  }

  function newRound(st) {
    var starter = st.starter === 1 ? 2 : 1;
    return { ver: st.ver + 1, board: EMPTY, turn: starter, winner: 0, line: [], last: -1, s1: st.s1, s2: st.s2, starter: starter };
  }

  function resolveSeat(my, peerSeat, isHost) {
    if (!my) return peerSeat ? 3 - peerSeat : (isHost ? 1 : 2);
    if (peerSeat === my && !isHost) return 3 - my;
    return my;
  }

  function validState(s) {
    return !!s && typeof s === "object" &&
      typeof s.ver === "number" && isFinite(s.ver) &&
      typeof s.board === "string" && /^[012]{42}$/.test(s.board) &&
      (s.turn === 1 || s.turn === 2) && (s.winner === 0 || s.winner === 1 || s.winner === 2 || s.winner === 3) &&
      Array.isArray(s.line) && s.line.length <= 7 && s.line.every(function (i) { return i >= 0 && i < N; }) &&
      typeof s.last === "number" && s.last >= -1 && s.last < N &&
      typeof s.s1 === "number" && typeof s.s2 === "number" && (s.starter === 1 || s.starter === 2);
  }

  function validImg(x) {
    return (typeof x === "string" && x.indexOf("data:image/jpeg;base64,") === 0 && x.length < 20000 && /^[A-Za-z0-9+\/=:;,]+$/.test(x)) ? x : "";
  }

  /* Bir cihazın bakış açısı. send, karşıya mesaj yollar. */
  function Node(o) {
    this.profile = o.profile || { name: "", img: "" };
    this.st = o.st && validState(o.st) ? o.st : fresh();
    this.mySeat = o.mySeat || 0;
    this.peer = { name: "", img: "", seat: 0 };
    this.isHost = !!o.isHost;
    this.send = o.send || function () {};
    this.onChange = o.onChange || function () {};
    this.connected = false;
  }
  Node.prototype.hello = function () {
    this.send({ t: "hello", seat: this.mySeat, name: this.profile.name || "", img: this.profile.img || "", st: this.st });
  };
  Node.prototype.receive = function (m) {
    if (!m || typeof m !== "object") return;
    if (m.t === "hello") {
      this.peer = { name: String(m.name || "").slice(0, 24), img: validImg(m.img), seat: (m.seat === 1 || m.seat === 2) ? m.seat : 0 };
      this.mySeat = resolveSeat(this.mySeat, this.peer.seat, this.isHost);
      if (validState(m.st) && m.st.ver > this.st.ver) this.st = m.st;
    } else if (m.t === "state") {
      if (validState(m.st) && m.st.ver > this.st.ver) this.st = m.st;
    }
    this.onChange();
  };
  Node.prototype.play = function (col) {
    if (!this.connected || !this.mySeat) return false;
    var n = move(this.st, this.mySeat, col);
    if (!n) return false;
    this.st = n; this.send({ t: "state", st: n }); this.onChange();
    return true;
  };
  Node.prototype.newRound = function () {
    if (!this.connected || !this.mySeat) return false;
    this.st = newRound(this.st); this.send({ t: "state", st: this.st }); this.onChange();
    return true;
  };

  var api = { ROWS: ROWS, COLS: COLS, N: N, EMPTY: EMPTY, fresh: fresh, dropRow: dropRow, winLine: winLine,
    move: move, newRound: newRound, resolveSeat: resolveSeat, validState: validState, validImg: validImg, Node: Node };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Core = api;
})(this);

</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var CODE_RE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/;
  var ID_PREFIX = "dortbagla-v1-";
  var PROFILE_KEY = "db4-profile", ROOM_KEY = "db4-room-", LAST_KEY = "db4-last";
  var TEST_SERVER = new URLSearchParams(location.search).get("ps"); /* yalnızca yerel deneme için */

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- Profil ---------- */
  var profile = { name: "", img: "" };
  try {
    var p0 = JSON.parse(lsGet(PROFILE_KEY) || "{}");
    profile.name = String(p0.name || "").slice(0, 24);
    profile.img = Core.validImg(p0.img);
  } catch (e) {}
  function saveProfile() { lsSet(PROFILE_KEY, JSON.stringify(profile)); }

  function renderPhotoBtn() {
    var b = $("photoBtn");
    b.dataset.has = profile.img ? "1" : "0";
    b.textContent = "";
    if (profile.img) {
      var im = document.createElement("img"); im.src = profile.img; im.alt = "Fotoğrafın";
      b.appendChild(im);
    } else {
      var s = document.createElement("span"); s.id = "photoHint"; s.innerHTML = "Fotoğraf<br>seç";
      b.appendChild(s);
    }
  }

  /* Seçilen fotoğrafı kare kırpıp 80 px'e küçültür; yüz genelde üst-ortada olduğu için kırpma biraz yukarı kaydırılır. */
  function processPhoto(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h);
        var sx = (w - s) / 2, sy = h > w ? (h - s) * 0.3 : (h - s) / 2;
        var c = document.createElement("canvas"); c.width = c.height = 80;
        c.getContext("2d").drawImage(im, sx, sy, s, s, 0, 0, 80, 80);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.62));
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error("okunamadı")); };
      im.src = url;
    });
  }

  $("photoBtn").addEventListener("click", function () { $("fileIn").click(); });
  $("fileIn").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    processPhoto(f).then(function (data) {
      profile.img = Core.validImg(data); saveProfile(); renderPhotoBtn();
      $("lobbyNote").textContent = "";
    }).catch(function () { $("lobbyNote").textContent = "Fotoğraf açılamadı. Başka bir fotoğraf dene."; });
    this.value = "";
  });
  $("nameIn").value = profile.name;
  $("nameIn").addEventListener("input", function () { profile.name = this.value.trim().slice(0, 24); saveProfile(); });
  renderPhotoBtn();

  /* ---------- Giriş ekranı ---------- */
  function newCode() {
    var a = new Uint32Array(6), out = "";
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < 6; i++) out += ALPHA.charAt(a[i] % ALPHA.length);
    return out;
  }
  function hashCode() {
    var h = (location.hash || "").replace(/^#/, "").toUpperCase();
    return CODE_RE.test(h) ? h : "";
  }
  function showLobby() {
    $("lobby").hidden = false; $("game").hidden = true;
    $("lead").textContent = "İkiniz için özel oda. Hesap gerekmez, bir kod yeter.";
    var hc = hashCode(), last = lsGet(LAST_KEY);
    $("invite").hidden = !hc; $("inviteCode").textContent = hc;
    $("enterBtn").hidden = !hc; $("newBtn").className = hc ? "btn" : "btn primary";
    var showLast = last && CODE_RE.test(last) && last !== hc;
    $("lastBtn").hidden = !showLast; if (showLast) $("lastBtn").textContent = "Son odaya dön (" + last + ")";
  }
  $("newBtn").addEventListener("click", function () { enterRoom(newCode()); });
  $("enterBtn").addEventListener("click", function () { enterRoom(hashCode()); });
  $("lastBtn").addEventListener("click", function () { enterRoom(lsGet(LAST_KEY)); });
  $("joinBtn").addEventListener("click", function () {
    var c = $("codeIn").value.trim().toUpperCase();
    if (!CODE_RE.test(c)) { $("lobbyNote").textContent = "Kod 6 karakter olmalı. Harf ve rakamlarla yaz."; return; }
    enterRoom(c);
  });
  $("codeIn").addEventListener("keydown", function (e) { if (e.key === "Enter") $("joinBtn").click(); });

  /* ---------- Oyun ekranı ---------- */
  var ROWS = Core.ROWS, COLS = Core.COLS, N = Core.N;
  var boardEl = $("board"), cells = [], ghosts = [], chips = {};
  for (var c = 0; c < COLS; c++) {
    (function (col) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "col"; b.setAttribute("aria-label", "Sütun " + (col + 1));
      var g = document.createElement("div"); g.className = "ghost";
      var gd = g.appendChild(document.createElement("i")); gd.className = "disc"; ghosts.push(gd);
      b.appendChild(g);
      for (var r = 0; r < ROWS; r++) {
        var cell = document.createElement("div"); cell.className = "cell";
        var d = document.createElement("i"); d.className = "disc";
        cell.appendChild(d); b.appendChild(cell); cells[r * COLS + col] = d;
      }
      b.addEventListener("click", function () { play(col); });
      boardEl.appendChild(b);
    })(c);
  }
  [1, 2].forEach(function (n) {
    var el = document.createElement("div"); el.className = "chip"; el.dataset.n = n;
    var who = document.createElement("div"); who.className = "who";
    var dot = document.createElement("span"); dot.className = "dot";
    var av = document.createElement("img"); av.className = "av"; av.alt = ""; av.hidden = true;
    var nm = document.createElement("span"); nm.className = "nm";
    var sc = document.createElement("div"); sc.className = "sc";
    who.appendChild(av); who.appendChild(dot); who.appendChild(nm);
    el.appendChild(who); el.appendChild(sc); $("players").appendChild(el);
    chips[n] = { el: el, nm: nm, sc: sc, av: av, dot: dot };
  });

  var room = "", node = null, peer = null, conn = null, retryT = 0, openT = 0, netNote = "", shownLast = null;

  function seatView() { return node.mySeat || (node.isHost ? 1 : 2); }
  function connected() { return !!(conn && conn.open && node.connected); }

  function render() {
    if (!node) return;
    var s = node.st, me = seatView(), ok = connected();
    for (var i = 0; i < N; i++) {
      var d = cells[i], p = s.board.charAt(i);
      if (p === "0") { if (d.dataset.p) delete d.dataset.p; } else if (d.dataset.p !== p) d.dataset.p = p;
      d.classList.toggle("win", s.line.indexOf(i) !== -1);
    }
    if (shownLast !== s.last) {
      if (shownLast !== null && s.last >= 0) {
        var dd = cells[s.last];
        dd.style.setProperty("--r", Math.floor(s.last / COLS));
        dd.classList.remove("drop"); void dd.offsetWidth; dd.classList.add("drop");
      }
      shownLast = s.last;
    }
    [1, 2].forEach(function (n) {
      var ch = chips[n], mine = n === me;
      var img = mine ? profile.img : node.peer.img;
      var name = mine ? (profile.name || "Ben") : (node.peer.name || (ok || node.peer.img ? "Rakip" : "Bekleniyor…"));
      ch.nm.textContent = name;
      if (img) { if (ch.av.getAttribute("src") !== img) ch.av.src = img; }
      ch.av.hidden = !img; ch.dot.hidden = !!img;
      boardEl.style.setProperty("--img" + n, img ? 'url("' + img + '")' : "none");
      ch.sc.textContent = s["s" + n];
      ch.el.dataset.active = (!s.winner && ok && s.turn === n) ? "1" : "0";
      ch.el.dataset.won = s.winner === n ? "1" : "0";
    });
    var text, turn = "";
    if (!ok) { text = "Rakip bekleniyor. Davet bağlantısını gönder."; }
    else if (s.winner === 3) { text = "Berabere!"; }
    else if (s.winner) { text = s.winner === me ? "Kazandın!" : "Rakip kazandı"; turn = String(s.winner); }
    else if (s.turn === me) { text = "Sıra sende"; turn = String(me); }
    else { text = "Rakibin sırası"; turn = String(s.turn); }
    $("statusText").textContent = text; $("status").dataset.turn = turn;
    boardEl.classList.toggle("mine", ok && !s.winner && s.turn === me);
    for (var gi = 0; gi < ghosts.length; gi++) ghosts[gi].dataset.p = String(s.turn);
    $("net").dataset.ok = ok ? "1" : "0";
    $("netText").textContent = ok ? "Rakip bağlı" : (netNote || "Rakip bekleniyor");
    $("roundBtn").disabled = !ok;
    $("roundBtn").className = "btn" + (s.winner ? " primary" : "");
    $("roundBtn").textContent = s.winner ? "Yeni tur" : "Turu baştan başlat";
    $("shareBtn").hidden = ok;
  }

  function persist() {
    if (!room) return;
    lsSet(ROOM_KEY + room, JSON.stringify({ st: node.st, mySeat: node.mySeat }));
  }

  /* ---------- Bağlantı (PeerJS, tarayıcılar doğrudan konuşur) ---------- */
  function peerOpts() {
    var o = { debug: 0 };
    if (TEST_SERVER) {
      var hp = TEST_SERVER.split(":");
      o.host = hp[0]; o.port = +hp[1] || 9000; o.path = "/"; o.secure = false; o.key = "peerjs";
      o.config = { iceServers: [] };
    }
    return o;
  }
  function destroyPeer() {
    clearTimeout(retryT); clearTimeout(openT);
    var p = peer; peer = null; conn = null;
    if (node) node.connected = false;
    if (p) { try { p.destroy(); } catch (e) {} }
  }
  function scheduleRetry(ms) {
    clearTimeout(retryT);
    retryT = setTimeout(openPeer, ms);
  }

  function attach(c) {
    conn = c; clearTimeout(openT);
    openT = setTimeout(function () {
      if (conn === c && !c.open) { try { c.close(); } catch (e) {} conn = null; netNote = "Bağlantı kurulamadı, tekrar deneniyor"; render(); scheduleRetry(1500); }
    }, 15000);
    c.on("open", function () {
      if (conn !== c) return;
      clearTimeout(openT); netNote = ""; node.connected = true; node.hello(); render();
    });
    c.on("data", function (m) { if (conn === c) node.receive(m); });
    var gone = function () {
      if (conn !== c) return;
      conn = null; node.connected = false; netNote = ""; render();
      if (!node.isHost) scheduleRetry(1500);
    };
    c.on("close", gone); c.on("error", gone);
  }

  function openPeer() {
    if (!room) return;
    destroyPeer();
    node.isHost = true; netNote = "Oda açılıyor"; render();
    var p = new Peer(ID_PREFIX + room, peerOpts()); peer = p;
    p.on("open", function () { if (peer === p) { netNote = ""; render(); } });
    p.on("connection", function (c) {
      if (peer !== p) return;
      if (conn && conn.open) { try { c.close(); } catch (e) {} return; }
      attach(c);
    });
    p.on("disconnected", function () { if (peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
    p.on("error", function (err) {
      if (peer !== p) return;
      if (err && err.type === "unavailable-id") { becomeGuest(); return; }
      netNote = "Sunucuya ulaşılamıyor, tekrar deneniyor"; render(); scheduleRetry(4000);
    });
  }
  function becomeGuest() {
    destroyPeer();
    node.isHost = false; netNote = "Bağlanılıyor"; render();
    var p = new Peer(undefined, peerOpts()); peer = p;
    p.on("open", function () {
      if (peer !== p) return;
      attach(p.connect(ID_PREFIX + room, { reliable: true, serialization: "json" }));
    });
    p.on("error", function (err) {
      if (peer !== p) return;
      if (err && err.type === "peer-unavailable") { netNote = "Oda sahibi bekleniyor"; render(); scheduleRetry(2500); return; }
      netNote = "Sunucuya ulaşılamıyor, tekrar deneniyor"; render(); scheduleRetry(4000);
    });
  }

  function enterRoom(code) {
    if (!CODE_RE.test(code || "")) { $("lobbyNote").textContent = "Oda kodu geçersiz."; return; }
    if (typeof Peer === "undefined") { $("lobbyNote").textContent = "Bağlantı kütüphanesi yüklenemedi. İnternetini kontrol edip sayfayı yenile."; return; }
    room = code; lsSet(LAST_KEY, code);
    var saved = null;
    try { saved = JSON.parse(lsGet(ROOM_KEY + code) || "null"); } catch (e) {}
    node = new Core.Node({
      st: saved && saved.st, mySeat: saved && saved.mySeat, isHost: true, profile: profile,
      send: function (m) { if (conn && conn.open) { try { conn.send(m); } catch (e) {} } },
      onChange: function () { persist(); render(); }
    });
    shownLast = null; netNote = "";
    if (location.hash.replace(/^#/, "").toUpperCase() !== code) history.replaceState(null, "", "#" + code);
    $("lobby").hidden = true; $("game").hidden = false;
    $("lead").textContent = "Fotoğrafın taşının içinde görünür.";
    $("roomCode").textContent = code; $("gameNote").textContent = "";
    render(); openPeer();
  }
  function leaveRoom() {
    destroyPeer(); node = null; room = "";
    history.replaceState(null, "", location.pathname + location.search);
    showLobby();
  }

  function play(col) { if (node) node.play(col); }
  $("roundBtn").addEventListener("click", function () { if (node) node.newRound(); });
  $("leaveBtn").addEventListener("click", leaveRoom);
  $("shareBtn").addEventListener("click", function () {
    var url = location.origin + location.pathname + "#" + room;
    var text = "Dört Bağla oynayalım! Oda kodu: " + room;
    if (navigator.share) { navigator.share({ title: "Dört Bağla", text: text, url: url }).catch(function () {}); return; }
    var done = function () { $("gameNote").textContent = "Bağlantı kopyalandı. Sevgiline gönder."; };
    var fail = function () { $("gameNote").textContent = "Kopyalanamadı. Bu bağlantıyı elle gönder: " + url; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fail); else fail();
  });
  document.addEventListener("keydown", function (e) {
    if (!node || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    if (e.key >= "1" && e.key <= "7") play(+e.key - 1);
  });
  /* Ekran kilidi açılınca bağlantıyı tazele */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && node && !connected()) scheduleRetry(300);
  });
  window.addEventListener("hashchange", function () { if (!node) showLobby(); });

  showLobby();
})();
</script>
</body>
</html>
